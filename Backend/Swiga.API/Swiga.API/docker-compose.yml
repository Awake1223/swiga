services:
  postgres:
    image: postgres:15
    container_name: swiga-db
    environment:
      POSTGRES_DB: SwigaDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postpostgresql/data

volumes:
  postgres_data: